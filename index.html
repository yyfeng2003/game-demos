<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>game-demos</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #1a2a3a, #0b0f14 60%);
      color: #e8eef4;
    }
    main {
      width: min(960px, 92vw);
      text-align: center;
      padding: 2rem 0;
    }
    h1 { margin: 0 0 0.5rem; font-weight: 650; letter-spacing: 0.02em; }
    p { margin: 0 0 1.25rem; opacity: 0.75; }
    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>game-demos</h1>
    <p>H5 / 视频演示门户 · GitHub Pages</p>
    <video controls preload="metadata" playsinline>
      <source src="videos/harry.mp4" type="video/mp4" />
      您的浏览器不支持视频播放。
    </video>
  </main>
</body>
</html>
